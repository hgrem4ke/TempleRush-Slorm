# Uploads the zip of a GitHub release to Nexus Mods as a new version of the existing file (Nexus-Mods/upload-action, beta).
# The Nexus page and its first file must already exist. Needs the repository secret NEXUSMODS_API_KEY
# (a key from https://www.nexusmods.com/settings/api-keys).
name: Upload to Nexus Mods

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to upload (e.g. v1.3.1)"
        required: true
      file_id:
        description: "Nexus file id to use instead of the default (optional)"
        required: false

permissions:
  contents: read

env:
  # TempleRush on Nexus Mods
  NEXUS_FILE_ID: "8477055"            # "File ID" (the number) of the file to add a version to
  NEXUS_MOD_ID: "44272522887190"      # "Unique Mod ID", needed for the changelog

jobs:
  nexus:
    runs-on: ubuntu-latest
    steps:
      - name: Check the API key
        id: key
        env:
          KEY: ${{ secrets.NEXUSMODS_API_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "The secret NEXUSMODS_API_KEY is not set: nothing is uploaded to Nexus Mods."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout (for the changelog)
        if: steps.key.outputs.present == 'true'
        uses: actions/checkout@v4

      - name: Get the release zip, its version and its changelog
        if: steps.key.outputs.present == 'true'
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.zip' --dir .
          ZIP=$(ls ./*.zip | head -n 1)
          VERSION="${TAG#v}"
          # The "### <version>" block of the changelog in README.md, without its title.
          awk -v v="### $VERSION" '$0==v {on=1; next} /^### / {on=0} on' README.md | sed '/^$/d' > changelog.txt
          echo "zip=$(basename "$ZIP")" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "--- changelog of $VERSION"; cat changelog.txt
          { echo 'changelog<<EOF_CHANGELOG'; cat changelog.txt; echo 'EOF_CHANGELOG'; } >> "$GITHUB_OUTPUT"

      - name: Upload to Nexus Mods
        if: steps.key.outputs.present == 'true'
        uses: Nexus-Mods/upload-action@v1.0.0-beta.11
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_id: ${{ inputs.file_id || env.NEXUS_FILE_ID }}
          filename: ${{ steps.release.outputs.zip }}
          version: ${{ steps.release.outputs.version }}
          display_name: TempleRush ${{ steps.release.outputs.version }}
          description: Fast clears in the Slorm Temple give bonus floors; Juicy Slorm upgrade to remove rooms from every floor.
          category: main
          update_mod_version: "true"
          mod_id: ${{ env.NEXUS_MOD_ID }}
          changelog: ${{ steps.release.outputs.changelog }}
